server:
    port: ${SERVER_PORT}
spring:
  application:
      name: lm
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM}
    show-sql: ${SPRING_JPA_SHOW_SQL}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW}
    properties:
      hibernate:
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}

springdoc:
  api-docs:
    path: ${SPRINGDOC_API_DOCS_PATH}
  swagger-ui:
    path: ${SPRINGDOC_SWAGGER_UI_PATH}

logging:
  level:
    com.credvenn.lm: ${LOGGING_LEVEL_COM_CREDVENN_LM}
  pattern:
    console: ${LOGGING_PATTERN_CONSOLE}

app:
  bootstrap:
    super-admin:
      username: ${APP_BOOTSTRAP_SUPER_ADMIN_USERNAME}
      email: ${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL}
      password: ${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD}
  device-control:
    scheduling:
      enabled: ${APP_DEVICE_CONTROL_SCHEDULING_ENABLED}
      tenant-sweeps-enabled: ${APP_DEVICE_CONTROL_SCHEDULING_TENANT_SWEEPS_ENABLED}
      daily-overdue-locks-enabled: ${APP_DEVICE_CONTROL_SCHEDULING_DAILY_OVERDUE_LOCKS_ENABLED}
      daily-unlocks-enabled: ${APP_DEVICE_CONTROL_SCHEDULING_DAILY_UNLOCKS_ENABLED}
  security:
    encryption-key: ${APP_SECURITY_ENCRYPTION_KEY}
    cors:
      allowed-origins: ${APP_SECURITY_CORS_ALLOWED_ORIGINS}
      allowed-methods: ${APP_SECURITY_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${APP_SECURITY_CORS_ALLOWED_HEADERS}
      exposed-headers: ${APP_SECURITY_CORS_EXPOSED_HEADERS:Authorization,Location}
      allow-credentials: ${APP_SECURITY_CORS_ALLOW_CREDENTIALS}
      max-age-seconds: ${APP_SECURITY_CORS_MAX_AGE_SECONDS}
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET}
      issuer: ${APP_SECURITY_JWT_ISSUER}
      service-secret: ${APP_SECURITY_JWT_SERVICE_SECRET}
      service-issuer: ${APP_SECURITY_JWT_SERVICE_ISSUER}
      access-token-expiration-seconds: ${APP_SECURITY_JWT_ACCESS_TOKEN_EXPIRATION_SECONDS}
      refresh-token-expiration-seconds: ${APP_SECURITY_JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}
  integration:
    kyc:
      provider: ${APP_INTEGRATION_KYC_PROVIDER}
      smile-id:
        base-url: ${APP_INTEGRATION_KYC_SMILE_ID_BASE_URL}
        partner-id: ${APP_INTEGRATION_KYC_SMILE_ID_PARTNER_ID}
        api-key: ${APP_INTEGRATION_KYC_SMILE_ID_API_KEY}
        signature-api-key: ${APP_INTEGRATION_KYC_SMILE_ID_SIGNATURE_API_KEY}
        source-sdk-version: ${APP_INTEGRATION_KYC_SMILE_ID_SOURCE_SDK_VERSION}
    statement:
      provider: ${APP_INTEGRATION_STATEMENT_PROVIDER}
      auto-trigger-document-types: ${APP_INTEGRATION_STATEMENT_AUTO_TRIGGER_DOCUMENT_TYPES:MPESA_STATEMENT,BANK_STATEMENT}
      document-type-providers:
        MPESA_STATEMENT: ${APP_INTEGRATION_STATEMENT_DOCUMENT_TYPE_PROVIDERS_MPESA_STATEMENT}
        BANK_STATEMENT: ${APP_INTEGRATION_STATEMENT_DOCUMENT_TYPE_PROVIDERS_BANK_STATEMENT}
    fineract:
      base-url: ${APP_INTEGRATION_FINERACT_BASE_URL}
      username: ${APP_INTEGRATION_FINERACT_USERNAME}
      password: ${APP_INTEGRATION_FINERACT_PASSWORD}
      default-office-id: ${APP_INTEGRATION_FINERACT_DEFAULT_OFFICE_ID}
      legal-form-id: ${APP_INTEGRATION_FINERACT_LEGAL_FORM_ID}
      locale: ${APP_INTEGRATION_FINERACT_LOCALE}
      date-format: ${APP_INTEGRATION_FINERACT_DATE_FORMAT}
      transaction-processing-strategy-code: ${APP_INTEGRATION_FINERACT_TRANSACTION_PROCESSING_STRATEGY_CODE}
    cladfy:
      base-url: ${APP_INTEGRATION_CLADFY_BASE_URL}
      api-key: ${APP_INTEGRATION_CLADFY_API_KEY}
      webhook-base-url: ${APP_INTEGRATION_CLADFY_WEBHOOK_BASE_URL}
  document:
    storage:
      provider: ${APP_DOCUMENT_STORAGE_PROVIDER}
      local:
        root-path: ${APP_DOCUMENT_STORAGE_LOCAL_ROOT_PATH}
      s3:
        bucket: ${APP_DOCUMENT_STORAGE_S3_BUCKET}
        region: ${APP_DOCUMENT_STORAGE_S3_REGION}
        prefix: ${APP_DOCUMENT_STORAGE_S3_PREFIX}
        endpoint: ${APP_DOCUMENT_STORAGE_S3_ENDPOINT:}
        access-key: ${APP_DOCUMENT_STORAGE_S3_ACCESS_KEY:}
        secret-key: ${APP_DOCUMENT_STORAGE_S3_SECRET_KEY:}
        path-style-access-enabled: ${APP_DOCUMENT_STORAGE_S3_PATH_STYLE_ACCESS_ENABLED}
  statement-inbox:
    local:
      root-path: ${APP_STATEMENT_INBOX_LOCAL_ROOT_PATH}
